<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobCheck Admin</title>
<style>body{font-family:Poppins,system-ui,sans-serif;background:#eaf4fd;color:#33476b;margin:0;padding:24px}.w{max-width:980px;margin:auto;background:#fff;border-radius:18px;padding:24px}
h1{margin:0 0 4px;font-size:22px}nav button{border:0;border-radius:99px;padding:8px 16px;margin:6px 6px 14px 0;background:#cfe6f4;cursor:pointer;font:inherit}nav button.on{background:#1a5bb8;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #e3ecf4;text-align:left;vertical-align:top}input,select{padding:8px;border:1px solid #cfe0ee;border-radius:8px;font:inherit}
.b{border:0;border-radius:99px;padding:6px 14px;color:#fff;background:#1a5bb8;cursor:pointer}.r{background:#d93636}.g{background:#1a9c5b}.o{background:#ff6a00}.k{display:inline-block;background:#eaf4fd;border-radius:12px;padding:12px 18px;margin:0 10px 10px 0}.k b{font-size:22px;display:block}</style></head><body><div class="w">
<h1>JobCheck Admin</h1><a href="/" style="font-size:12px">← Back to checker</a><div id="msg" style="color:#d93636;font-size:13px;margin:8px 0"></div>
<nav id="tabs"></nav><div id="v"></div></div>
<script>
const T=localStorage.jc_token,$=i=>document.getElementById(i);let tab='review';
const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.status);return j};
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tabs={review:'Review queue',lists:'Whitelist / Blacklist',kb:'Knowledge base',stats:'Analytics'};
function draw(){$('tabs').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';draw()">${v}</button>`).join('');load()}
async function load(){$('msg').textContent='';try{
if(tab=='review'){const d=await api('/admin/review');$('v').innerHTML=`<p style="font-size:12px">Suspicious posts and user-reported verdicts. Confirm the true label — confirmed labels feed retraining.</p><table><tr><th>#</th><th>Verdict</th><th>Text</th><th>User says</th><th>Confirm as</th></tr>${d.map(s=>`<tr><td>${s.id}</td><td>${e(s.category)} ${(s.confidence*100).toFixed(0)}%</td><td>${e(s.source_url||'')} ${e(s.preview)}</td><td>${s.suggested_label==null?'—':s.suggested_label?'Scam':'Legit'}</td><td><button class="b r" onclick="rs(${s.id},1)">Scam</button> <button class="b g" onclick="rs(${s.id},0)">Legit</button></td></tr>`).join('')||'<tr><td colspan=5>Queue is empty.</td></tr>'}</table><p><button class="b o" onclick="rt()">Retrain model on confirmed labels</button></p>`}
if(tab=='lists'){const d=await api('/admin/companies');$('v').innerHTML=`<p><input id="dm" placeholder="domain e.g. acme.com"> <select id="st"><option>whitelist</option><option>blacklist</option></select> <button class="b" onclick="ac()">Add</button></p><table><tr><th>Domain</th><th>Status</th><th></th></tr>${d.map(c=>`<tr><td>${e(c.domain)}</td><td>${c.status}</td><td><button class="b r" onclick="api('/admin/companies/${c.id}','DELETE').then(load)">Remove</button></td></tr>`).join('')}</table>`}
if(tab=='kb'){const d=await api('/patterns');$('v').innerHTML=`<p><select id="pl"><option>scam</option><option>legit</option></select> <input id="pd" size="50" placeholder="Pattern description"> <button class="b" onclick="ap()">Add pattern</button></p><table><tr><th>ID</th><th>Label</th><th>Description</th><th></th></tr>${d.map(p=>`<tr><td>${p.id}</td><td>${p.label}</td><td>${e(p.description)}</td><td><button class="b r" onclick="api('/admin/patterns/${p.id}','DELETE').then(load)">Remove</button></td></tr>`).join('')}</table>`}
if(tab=='stats'){const d=await api('/admin/analytics');const c=d.by_category;$('v').innerHTML=[['Checks',d.total],['Users',d.users],['Safe',c.Safe||0],['Suspicious',c.Suspicious||0],['Unsafe',c.Unsafe||0],['Reports pending',d.reported_pending],['Confirmed labels',d.confirmed_labels],['Awaiting retrain',d.awaiting_retrain],['Model agreement',d.model_agreement==null?'—':(d.model_agreement*100).toFixed(0)+'%']].map(([k,v])=>`<div class="k"><b>${v}</b>${k}</div>`).join('')}
}catch(x){$('msg').innerHTML=(x.message.includes('401')||x.message.includes('Login')||x.message.includes('Administrator'))?'Admin login required. <a href="/">Log in as an administrator on the main page</a>.':e(x.message)}}
const rs=(id,l)=>api(`/admin/submissions/${id}/resolve`,'POST',{label:l}).then(load).catch(x=>$('msg').textContent=x.message);
const rt=()=>api('/admin/retrain','POST').then(r=>{$('msg').style.color='#1a9c5b';$('msg').textContent='Retrained with '+r.added_examples+' new examples.'}).catch(x=>$('msg').textContent=x.message);
const ac=()=>api('/admin/companies','POST',{domain:$('dm').value,status:$('st').value}).then(load).catch(x=>$('msg').textContent=x.message);
const ap=()=>api('/admin/patterns','POST',{label:$('pl').value,description:$('pd').value}).then(load).catch(x=>$('msg').textContent=x.message);
draw();
</script></body></html>
